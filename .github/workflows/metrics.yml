name: Metrics

on:
  schedule: [{cron: "0 9 * * *"}]   # 06:00 America/Sao_Paulo
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HyakoV3
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo

          # ── ANONIMATO ────────────────────────────────────────────────
          # base vazio de propósito: as seções padrão "activity" e
          # "repositories" imprimem NOMES DE REPOSITÓRIO no SVG.
          # Não reative sem lembrar que 15 dos 16 repos são privados.
          base: ""

          # Reconhece meus commits nas análises que varrem o histórico
          commits_authoring: edicgarcia@outlook.com, hyakov2@gmail.com, HyakoV3

          # ── LINGUAGENS (agregado, inclui privados via PAT) ───────────
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_colors: rainbow
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, makefile, dockerfile, plpgsql, sqlpl

          # ── VOLUME DE CÓDIGO ─────────────────────────────────────────
          plugin_lines: yes
          plugin_lines_sections: base      # "repositories" vazaria nomes

          # ── RITMO ────────────────────────────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
