name: Metrics

on:
  schedule: [{cron: "0 9 * * *"}]   # 06:00 America/Sao_Paulo
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # build ~5 min + análise ≤35 min; nunca mais 6 h pendurado
    permissions:
      contents: write
    steps:
      # Fork próprio, pinado por SHA: o upstream (lowlighter/metrics) está sem
      # commits desde 2023-12. A v3.34 e a imagem v3.35-beta clonam SEM token
      # (falha em repo privado); o fix #1579 só existe no master, cujo
      # Dockerfile não builda mais em 2026 (nokogiri). O fork = master + Dockerfile.
      - uses: HyakoV3/metrics@d218e13f5c96c4e985567ebf98adb0adc4d914eb
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: HyakoV3
          filename: github-metrics.svg
          template: classic
          config_timezone: America/Sao_Paulo

          # ── ANONIMATO ────────────────────────────────────────────────
          # base vazio de propósito: as seções padrão "activity" e
          # "repositories" imprimem NOMES DE REPOSITÓRIO no SVG.
          # Não reative sem lembrar que 15 dos 16 repos são privados.
          base: ""

          # Reconhece meus commits nas análises que varrem o histórico
          commits_authoring: edicgarcia@outlook.com, hyakov2@gmail.com, HyakoV3

          # ── LINGUAGENS (agregado, inclui privados via PAT) ───────────
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 35   # global; ~2.6k commits
          plugin_languages_analysis_timeout_repositories: 30   # por repo; o padrão (7.5) truncava o repo com mais commits
          plugin_languages_colors: rainbow
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_ignored: html, css, makefile, dockerfile, plpgsql, sqlpl

          # ── VOLUME DE CÓDIGO ─────────────────────────────────────────
          plugin_lines: yes
          plugin_lines_sections: history   # "base" só renderiza dentro do base:repositories (desligado); "repositories" vazaria nomes
          plugin_lines_history_limit: 3

          # ── RITMO ────────────────────────────────────────────────────
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

